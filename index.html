<!DOCTYPE html>
<html>

<head>
    <title>ABI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            background: #000000;
            color: #ffffff;
            flex-direction: column;
        }

        .header {
            background: #111111;
            padding: 1rem;
            display: grid;
            grid-template-columns: 40px 1fr 40px;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 1000;
        }

        .hamburger {
            grid-column: 1;
            width: 30px;
            height: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            cursor: pointer;
            padding: 5px;
        }

        .header h1 {
            grid-column: 2;
            margin: 0;
            font-size: 1.5rem;
            text-align: center;
        }

        .hamburger span {
            width: 100%;
            height: 3px;
            background: #ffffff;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .main-content {
            display: flex;
            flex: 1;
            position: relative;
            height: calc(100vh - 64px);
        }

        .sidebar {
            width: 200px;
            background: #111111;
            height: 100%;
            padding: 20px;
            border-right: 1px solid #333;
            position: absolute;
            left: -240px;
            transition: left 0.3s ease;
            z-index: 999;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar button:hover {
            background: #333;
            border-color: #666;
        }

        .graph-container {
            flex: 1;
            position: relative;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #333;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            z-index: 1000;
            color: #fff;
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
        }

        .node {
            cursor: pointer;
        }

        .node circle {
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 2px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }

        .node text {
            font-size: 12px;
            fill: #fff;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI";
        }

        .link {
            stroke-opacity: 0.6;
            stroke-width: 1px;
        }

        .node.dimmed circle {
            opacity: 0.3;
        }

        .node.dimmed text {
            opacity: 0.3;
        }

        .link.dimmed {
            opacity: 0.1;
        }

        .node.highlighted circle {
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
        }

        .modal input,
        .modal select {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
        }

        .modal button {
            padding: 8px 16px;
            margin: 5px;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            background: #333;
            color: #fff;
        }

        .modal button.submit:hover {
            background: #444;
        }

        .modal-content {
            margin-bottom: 15px;
        }

        .delete-warning {
            color: #ff4444;
            margin: 10px 0;
        }

        .node-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 5px;
        }

        .node-list-item {
            padding: 8px;
            margin: 2px 0;
            background: #222;
            border-radius: 4px;
            cursor: pointer;
        }

        .node-list-item:hover {
            background: #333;
        }

        .node-list-item.selected {
            background: #444;
            border: 1px solid #666;
        }

        /* Style for dotted connections */
        .link.connection {
            stroke-dasharray: 5, 5;
            stroke-width: 2px;
        }

        /* Additional button styles */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .danger-button {
            background: #662222 !important;
        }

        .danger-button:hover {
            background: #993333 !important;
        }

        .link {
            stroke: rgba(255, 255, 255, 0.6);
            stroke-opacity: 0.6;
            stroke-width: 1px;
        }

        /* Update connection style to focus on the dash pattern only */
        .link.connection {
            stroke-dasharray: 5, 5;
            stroke-width: 2px;
            stroke-opacity: 0.8;
        }

        .link.connection.dimmed {
            stroke-opacity: 0.2;
        }

        .node.root circle {
            stroke: #FFD700;
            stroke-width: 3px;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.5));
        }

        .node.root text {
            font-weight: bold;
            font-size: 14px;
            fill: #FFD700;
        }

        /* Style for root connections */
        .link.root-connection {
            stroke: #FFD700;
            stroke-dasharray: 5, 5;
            stroke-width: 2px;
            stroke-opacity: 0.8;
        }


        .right-panel {
            position: fixed;
            right: 0;
            top: 64px;
            width: 300px;
            height: calc(100vh - 64px);
            background: #111111;
            border-left: 1px solid #333;
            padding: 20px;
            color: #ffffff;
            overflow-y: auto;
        }

        .stats-container {
            margin-bottom: 30px;
            padding: 15px;
            background: #222;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 8px;
            background: #333;
            border-radius: 4px;
        }

        .logs-container {
            padding: 15px;
            background: #222;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .log-item {
            padding: 10px;
            margin: 8px 0;
            background: #333;
            border-radius: 4px;
            font-size: 0.9em;
            border-left: 3px solid #4169E1;
        }

        .log-timestamp {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 4px;
        }

        .user-info-modal {
            width: 300px;
        }

        .user-info-fields {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .main-content {
            margin-right: 300px;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="hamburger" onclick="toggleSidebar()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <h1>Commercial Connectedness</h1>
    </header>

    <div class="main-content">
        <div class="sidebar">
            <button onclick="showAddRootModal()">Add Root Node</button>
            <button onclick="showAddClusterModal()">Add Cluster</button>
            <button onclick="showAddTaskModal()">Add Task</button>
            <button onclick="showDeleteModal()">Delete Node</button>
            <button onclick="showEditModal()">Edit Node</button>
            <button onclick="showConnectionModal()">Create Connection</button>
            <button onclick="showRootConnectionModal()">Connect to Root</button>
        </div>

        <div class="graph-container">
            <svg id="graph"></svg>
        </div>
    </div>

    <div class="right-panel">
        <div class="stats-container">
            <h3>Graph Statistics</h3>
            <div class="stat-item">
                <span>Root Nodes:</span>
                <span id="rootNodeCount">0</span>
            </div>
            <div class="stat-item">
                <span>Clusters:</span>
                <span id="clusterCount">0</span>
            </div>
            <div class="stat-item">
                <span>Child Nodes:</span>
                <span id="childNodeCount">0</span>
            </div>
            <div class="stat-item">
                <span>Total Connections:</span>
                <span id="connectionCount">0</span>
            </div>
        </div>

        <div class="logs-container">
            <h3>Recent Activity</h3>
            <div id="activityLogs"></div>
        </div>
    </div>

    <div id="rootModal" class="modal">
        <h3>Add Root Node</h3>
        <input type="text" id="rootInput" placeholder="Enter root node name">
        <div class="user-info-fields">
            <input type="text" id="rootUserNameInput" placeholder="Your Name" class="modal-input">
            <input type="text" id="rootBusinessFunctionInput" placeholder="Business Function" class="modal-input">
        </div>
        <div class="button-group">
            <button class="submit" onclick="addRootNode()">Add</button>
            <button class="cancel" onclick="hideModals()">Cancel</button>
        </div>
    </div>

    <!-- Add new modal for root connections -->
    <div id="rootConnectionModal" class="modal">
        <h3>Connect to Root Node</h3>
        <div class="modal-content">
            <select id="rootConnectionClusterSelect">
                <option value="">Select Cluster</option>
            </select>
            <div class="node-list" id="rootConnectionNodeList"></div>
        </div>
        <div class="user-info-fields">
            <input type="text" id="rootConnectionUserNameInput" placeholder="Your Name" class="modal-input">
            <input type="text" id="rootConnectionBusinessFunctionInput" placeholder="Business Function"
                class="modal-input">
        </div>
        <div class="button-group">
            <button class="submit" onclick="createRootConnection()">Connect to Root</button>
            <button class="cancel" onclick="hideModals()">Cancel</button>
        </div>
    </div>
    <div id="clusterModal" class="modal">
        <h3>Add New Cluster</h3>
        <input type="text" id="clusterInput" placeholder="Enter cluster name">
        <div class="user-info-fields">
            <input type="text" id="clusterUserNameInput" placeholder="Your Name" class="modal-input">
            <input type="text" id="clusterBusinessFunctionInput" placeholder="Business Function" class="modal-input">
        </div>
        <button class="submit" onclick="addCluster()">Add</button>
        <button class="cancel" onclick="hideModals()">Cancel</button>
    </div>


    <div id="taskModal" class="modal">
        <h3>Add New Task</h3>
        <select id="clusterSelect">
            <option value="">Select Cluster</option>
        </select>
        <input type="text" id="taskInput" placeholder="Enter task name">
        <div class="user-info-fields">
            <input type="text" id="taskUserNameInput" placeholder="Your Name" class="modal-input">
            <input type="text" id="taskBusinessFunctionInput" placeholder="Business Function" class="modal-input">
        </div>
        <button class="submit" onclick="addTask()">Add</button>
        <button class="cancel" onclick="hideModals()">Cancel</button>
    </div>


    <div id="deleteModal" class="modal">
        <h3>Delete Node</h3>
        <div class="modal-content">
            <select id="deleteClusterSelect">
                <option value="">Select Cluster</option>
            </select>
            <div class="node-list" id="deleteNodeList"></div>
            <div id="deleteWarning" class="delete-warning"></div>
        </div>
        <div class="user-info-fields">
            <input type="text" id="deleteUserNameInput" placeholder="Your Name" class="modal-input">
            <input type="text" id="deleteBusinessFunctionInput" placeholder="Business Function" class="modal-input">
        </div>
        <div class="button-group">
            <button class="submit danger-button" onclick="confirmDelete()">Delete</button>
            <button class="cancel" onclick="hideModals()">Cancel</button>
        </div>
    </div>

    <div id="editModal" class="modal">
        <h3>Edit Node</h3>
        <div class="modal-content">
            <select id="editClusterSelect">
                <option value="">Select Cluster</option>
            </select>
            <div class="node-list" id="editNodeList"></div>
            <input type="text" id="editNameInput" placeholder="New name">
        </div>
        <div class="button-group">
            <button class="submit" onclick="confirmEdit()">Save</button>
            <button class="cancel" onclick="hideModals()">Cancel</button>
        </div>
    </div>

    <div id="connectionModal" class="modal">
        <h3>Create Connection</h3>
        <div class="modal-content">
            <h4>Source</h4>
            <select id="sourceClusterSelect">
                <option value="">Select Source Cluster</option>
            </select>
            <div class="node-list" id="sourceNodeList"></div>

            <h4>Target</h4>
            <select id="targetClusterSelect">
                <option value="">Select Target Cluster</option>
            </select>
            <div class="node-list" id="targetNodeList"></div>
        </div>
        <div id="userInfoFields" class="user-info-fields">
            <input type="text" id="userNameInput" placeholder="Your Name" class="modal-input">
            <input type="text" id="businessFunctionInput" placeholder="Business Function" class="modal-input">
        </div>
        <div class="button-group">
            <button class="submit" onclick="createConnection()">Connect</button>
            <button class="cancel" onclick="hideModals()">Cancel</button>
        </div>
    </div>


    <div class="modal-backdrop" onclick="hideModals()"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script>
        // Enhanced color palette for clusters
        const clusterColors = [
            '#FF1E1E', '#FFB200', '#EB5B00', '#D91656',
            '#640D5F', '#FF8F00', '#FFDB00', '#4169E1',
            '#EE66A6', '#00FF00'
        ];

        let nextColorIndex = 0;

        // Initial data structure - now empty as there's no root node
        let data = {
            nodes: [],
            links: []
        };

        const maxLogEntries = 8;
        let activityLogs = [];

        function updateStats() {
            document.getElementById('rootNodeCount').textContent = data.nodes.filter(n => n.type === 'root').length;
            document.getElementById('clusterCount').textContent = data.nodes.filter(n => n.type === 'cluster').length;
            document.getElementById('childNodeCount').textContent = data.nodes.filter(n => n.type === 'task').length;
            document.getElementById('connectionCount').textContent = data.links.length;
        }

        function addActivityLog(action, userName, businessFunction) {
            const timestamp = new Date().toLocaleString();
            const logEntry = {
                timestamp,
                action,
                userName,
                businessFunction
            };

            activityLogs.unshift(logEntry);
            if (activityLogs.length > maxLogEntries) {
                activityLogs.pop();
            }

            updateActivityLogs();
        }

        function updateActivityLogs() {
            const logsContainer = document.getElementById('activityLogs');
            logsContainer.innerHTML = '';

            activityLogs.forEach(log => {
                const logItem = document.createElement('div');
                logItem.className = 'log-item';
                logItem.innerHTML = `
                    <div class="log-timestamp">${log.timestamp}</div>
                    <div>${log.userName} (${log.businessFunction})</div>
                    <div>${log.action}</div>
                `;
                logsContainer.appendChild(logItem);
            });
        }


        const width = window.innerWidth - 200;
        const height = window.innerHeight;

        const svg = d3.select("#graph")
            .attr("width", width)
            .attr("height", height);

        // Enhanced force simulation
        const simulation = d3.forceSimulation()
            .force("link", d3.forceLink().id(d => d.id)
                .distance(d => {
                    // Increase distance based on number of siblings
                    if (d.source.type !== "cluster") {
                        const siblingCount = getSiblingCount(d.source);
                        return Math.max(100, 60 + siblingCount * 15);
                    }
                    return 60;
                })
                .strength(0.5))
            .force("charge", d3.forceManyBody()
                .strength(d => d.type === "cluster" ? -500 : -100))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(d => {
                // Increase collision radius for clusters based on number of children
                if (d.type === "cluster") {
                    const childCount = getClusterLeafCount(d.id);
                    return Math.max(50, 30 + childCount * 10);
                }
                return 20;
            }))
            .force("x", d3.forceX(width / 2).strength(0.05))
            .force("y", d3.forceY(height / 2).strength(0.05));


        function circularLayoutForce(alpha) {
            const clusters = data.nodes.filter(n => n.type === "cluster");

            clusters.forEach(cluster => {
                const children = data.nodes.filter(n =>
                    n.type !== "cluster" &&
                    data.links.some(l => l.target.id === cluster.id && l.source.id === n.id)
                );

                if (children.length > 0) {
                    const radius = Math.max(80, children.length * 20);
                    const angleStep = (2 * Math.PI) / children.length;

                    children.forEach((child, i) => {
                        const angle = i * angleStep;
                        const targetX = cluster.x + radius * Math.cos(angle);
                        const targetY = cluster.y + radius * Math.sin(angle);

                        // Apply force towards the target position
                        child.vx = (targetX - child.x) * alpha * 0.3;
                        child.vy = (targetY - child.y) * alpha * 0.3;

                        // Add slight repulsion between siblings
                        children.forEach((sibling, j) => {
                            if (i !== j) {
                                const dx = child.x - sibling.x;
                                const dy = child.y - sibling.y;
                                const dist = Math.sqrt(dx * dx + dy * dy);
                                if (dist < radius / 2) {
                                    child.vx += dx * alpha * 0.1;
                                    child.vy += dy * alpha * 0.1;
                                }
                            }
                        });
                    });
                }
            });
        }

        // Add the circular layout force to the simulation
        simulation.force("circular", circularLayoutForce);


        let link = svg.append("g").selectAll("line");
        let node = svg.append("g").selectAll("g");


        function getClusterLeafCount(clusterId) {
            return data.nodes.filter(n =>
                n.type === "task" && data.links.some(l =>
                    l.source.id === n.id && l.target.id === clusterId
                )
            ).length;
        }

        function getNodeRadius(d) {
            if (d.type === "cluster") {
                const childCount = getClusterLeafCount(d.id);
                // Start with a smaller base size, increase slightly with more children
                return Math.min(25, 15 + childCount * 0.5);
            }
            // Child nodes start larger and decrease with siblings
            const siblingCount = getSiblingCount(d);
            return Math.max(8, 12 - siblingCount * 0.3);
        }

        function getSiblingCount(node) {
            if (node.type === "cluster") return 0;

            const parentLink = data.links.find(l => l.source.id === node.id);
            if (!parentLink) return 0;

            return data.links.filter(l =>
                l.target.id === parentLink.target.id &&
                l.source.id !== node.id
            ).length;
        }

        function getNodeColor(d) {
            return d.color || '#4169E1';
        }

        let rootNode = null;

        // Add root node functions
        function showAddRootModal() {
            if (rootNode) {
                alert("Root node already exists!");
                return;
            }
            document.getElementById("rootModal").style.display = "block";
            document.querySelector(".modal-backdrop").style.display = "block";
        }

        function addRootNode() {
            const rootName = document.getElementById("rootInput").value;
            const userName = document.getElementById("rootUserNameInput").value;
            const businessFunction = document.getElementById("rootBusinessFunctionInput").value;

            if (rootName.trim() === "" || userName.trim() === "" || businessFunction.trim() === "") {
                alert("Please fill in all fields");
                return;
            }

            rootNode = {
                id: `root-${Date.now()}`,
                name: rootName,
                type: "root",
                color: "#FFD700"
            };

            data.nodes.push(rootNode);
            addActivityLog(`Added root node "${rootName}"`, userName, businessFunction);
            hideModals();
            updateGraph();
            updateStats();
        }

        function showRootConnectionModal() {
            if (!rootNode) {
                alert("Please add a root node first!");
                return;
            }
            document.getElementById("rootConnectionModal").style.display = "block";
            document.querySelector(".modal-backdrop").style.display = "block";
            updateRootConnectionSelects();
        }

        function updateRootConnectionSelects() {
            const select = document.getElementById("rootConnectionClusterSelect");
            select.innerHTML = '<option value="">Select Cluster</option>';
            data.nodes
                .filter(node => node.type === "cluster")
                .forEach(cluster => {
                    const option = document.createElement("option");
                    option.value = cluster.id;
                    option.textContent = cluster.name;
                    select.appendChild(option);
                });
        }

        function updateRootConnectionNodeList(clusterId) {
            const nodeList = document.getElementById("rootConnectionNodeList");
            nodeList.innerHTML = '';

            // Add the cluster itself as an option
            const cluster = data.nodes.find(n => n.id === clusterId);
            if (cluster) {
                const clusterDiv = document.createElement("div");
                clusterDiv.className = "node-list-item";
                clusterDiv.textContent = `${cluster.name} (cluster)`;
                clusterDiv.onclick = () => selectNodeForRootConnection(cluster, clusterDiv);
                nodeList.appendChild(clusterDiv);
            }

            // Add all nodes in the cluster
            const nodes = data.nodes.filter(node =>
                data.links.some(link => link.target.id === clusterId && link.source.id === node.id)
            );

            nodes.forEach(node => {
                const div = document.createElement("div");
                div.className = "node-list-item";
                div.textContent = `${node.name} (${node.type})`;
                div.onclick = () => selectNodeForRootConnection(node, div);
                nodeList.appendChild(div);
            });
        }

        let selectedNodeForRootConnection = null;

        function selectNodeForRootConnection(node, element) {
            selectedNodeForRootConnection = node;
            document.querySelectorAll(".node-list-item").forEach(item =>
                item.classList.remove("selected"));
            element.classList.add("selected");
        }

        function createRootConnection() {
            if (!selectedNodeForRootConnection || !rootNode) return;

            const userName = document.getElementById("rootConnectionUserNameInput").value;
            const businessFunction = document.getElementById("rootConnectionBusinessFunctionInput").value;

            if (userName.trim() === "" || businessFunction.trim() === "") {
                alert("Please fill in all fields");
                return;
            }

            // Check if connection already exists
            const connectionExists = data.links.some(link =>
                (link.source.id === selectedNodeForRootConnection.id && link.target.id === rootNode.id) ||
                (link.source.id === rootNode.id && link.target.id === selectedNodeForRootConnection.id)
            );

            if (!connectionExists) {
                data.links.push({
                    source: selectedNodeForRootConnection.id,
                    target: rootNode.id,
                    type: 'root-connection'
                });

                addActivityLog(
                    `Connected "${selectedNodeForRootConnection.name}" to root node`,
                    userName,
                    businessFunction
                );
            }

            selectedNodeForRootConnection = null;
            hideModals();
            updateGraph();
        }

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('open');
            const width = window.innerWidth;
            d3.select("#graph").attr("width", width);
            simulation.force("center", d3.forceCenter(width / 2, height / 2));
            simulation.alpha(0.3).restart();
        }

        let selectedNodeForDelete = null;
        let selectedNodeForEdit = null;
        let selectedSourceNode = null;
        let selectedTargetNode = null;

        function updateGraph() {
            // Update links
            link = link.data(data.links, d => `${d.source.id}-${d.target.id}`);
            link.exit().remove();
            const linkEnter = link.enter().append("line")
                .attr("class", d => {
                    if (d.type === 'root-connection') return 'link root-connection';
                    if (d.type === 'connection') return 'link connection';
                    return 'link';
                });
            link = linkEnter.merge(link);
            link.style("stroke", d => {
                if (d.type === 'root-connection') return '#FFD700';
                if (d.type === 'connection') {
                    const sourceNode = data.nodes.find(n => n.id === (typeof d.source === 'object' ? d.source.id : d.source));
                    return sourceNode ? sourceNode.color : '#ffffff';
                }
                return 'rgba(255, 255, 255, 0.6)';
            });


            // Update nodes with proper data binding
            node = node.data(data.nodes, d => d.id);
            node.exit().remove();


            const nodeEnter = node.enter().append("g")
                .attr("class", d => `node ${d.type === 'root' ? 'root' : ''}`)
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended))
                .on("click", handleNodeClick);


            nodeEnter.append("circle")
                .attr("r", getNodeRadius);

            nodeEnter.append("text")
                .attr("dy", ".35em")
                .attr("x", d => d.type === "cluster" ? 25 : 15);

            node = nodeEnter.merge(node);

            // Update existing nodes
            node.select("circle")
                .attr("r", getNodeRadius)
                .style("fill", getNodeColor);

            node.select("text")
                .text(d => d.name);  // Update the text content

            // Update simulation
            simulation.nodes(data.nodes)
                .on("tick", ticked);

            simulation.force("link")
                .links(data.links);

            // Add circular layout force for clusters
            data.nodes.filter(n => n.type === "cluster").forEach(cluster => {
                const children = data.nodes.filter(n =>
                    data.links.some(l => l.target.id === cluster.id && l.source.id === n.id)
                );

                if (children.length > 0) {
                    const radius = Math.max(100, children.length * 20);
                    const angleStep = (2 * Math.PI) / children.length;

                    children.forEach((child, i) => {
                        const angle = i * angleStep;
                        const targetX = cluster.x + radius * Math.cos(angle);
                        const targetY = cluster.y + radius * Math.sin(angle);

                        child.x = child.x || targetX;
                        child.y = child.y || targetY;
                    });
                }
            });

            simulation.alpha(1).restart();
            const originalUpdateGraph = updateGraph;
            updateGraph = function () {
                originalUpdateGraph();
                updateStats();
            };
            updateSelects();

        }
        document.getElementById("rootConnectionClusterSelect").addEventListener("change", (e) => {
            updateRootConnectionNodeList(e.target.value);
        });

        // Delete functionality
        function showDeleteModal() {
            document.getElementById("deleteModal").style.display = "block";
            document.querySelector(".modal-backdrop").style.display = "block";
            updateDeleteClusterSelect();
        }

        function updateDeleteClusterSelect() {
            const select = document.getElementById("deleteClusterSelect");
            select.innerHTML = '<option value="">Select Cluster</option>';
            data.nodes
                .filter(node => node.type === "cluster")
                .forEach(cluster => {
                    const option = document.createElement("option");
                    option.value = cluster.id;
                    option.textContent = cluster.name;
                    select.appendChild(option);
                });
        }

        function updateDeleteNodeList(clusterId) {
            const nodeList = document.getElementById("deleteNodeList");
            nodeList.innerHTML = '';

            // Get all nodes in the cluster
            const nodes = data.nodes.filter(node => {
                if (node.id === clusterId) return true;
                return data.links.some(link =>
                    link.target.id === clusterId && link.source.id === node.id);
            });

            nodes.forEach(node => {
                const div = document.createElement("div");
                div.className = "node-list-item";
                div.textContent = `${node.name} (${node.type})`;
                div.onclick = () => selectNodeForDelete(node, div);
                nodeList.appendChild(div);
            });
        }

        function selectNodeForDelete(node, element) {
            selectedNodeForDelete = node;
            document.querySelectorAll(".node-list-item").forEach(item =>
                item.classList.remove("selected"));
            element.classList.add("selected");

            // Update warning message
            const warning = document.getElementById("deleteWarning");
            if (node.type === "cluster") {
                const connectedNodes = data.nodes.filter(n =>
                    data.links.some(l => l.target.id === node.id && l.source.id === n.id)
                ).length;
                warning.textContent =
                    `Warning: Deleting this cluster will also delete ${connectedNodes} connected nodes!`;
            } else {
                warning.textContent = "";
            }
        }

        function confirmDelete() {
            if (!selectedNodeForDelete) return;

            const userName = document.getElementById("deleteUserNameInput").value;
            const businessFunction = document.getElementById("deleteBusinessFunctionInput").value;

            if (userName.trim() === "" || businessFunction.trim() === "") {
                alert("Please fill in all fields");
                return;
            }

            if (selectedNodeForDelete.type === "cluster") {
                // Delete cluster and all connected nodes
                const connectedNodeIds = data.nodes
                    .filter(n => data.links.some(l =>
                        l.target.id === selectedNodeForDelete.id && l.source.id === n.id
                    ))
                    .map(n => n.id);

                data.nodes = data.nodes.filter(n =>
                    n.id !== selectedNodeForDelete.id && !connectedNodeIds.includes(n.id));

                // Remove all links connected to the cluster or its nodes
                data.links = data.links.filter(l =>
                    !connectedNodeIds.includes(l.source.id) &&
                    !connectedNodeIds.includes(l.target.id) &&
                    l.source.id !== selectedNodeForDelete.id &&
                    l.target.id !== selectedNodeForDelete.id);

                addActivityLog(
                    `Deleted cluster "${selectedNodeForDelete.name}" and its connected nodes`,
                    userName,
                    businessFunction
                );
            } else {
                // Delete single node
                data.nodes = data.nodes.filter(n => n.id !== selectedNodeForDelete.id);

                // Remove all links connected to this node
                const initialLinkCount = data.links.length;
                data.links = data.links.filter(l =>
                    l.source.id !== selectedNodeForDelete.id &&
                    l.target.id !== selectedNodeForDelete.id);

                addActivityLog(
                    `Deleted node "${selectedNodeForDelete.name}"`,
                    userName,
                    businessFunction
                );
            }

            selectedNodeForDelete = null;
            hideModals();
            updateGraph();
            updateStats();
        }

        // Edit functionality
        function showEditModal() {
            document.getElementById("editModal").style.display = "block";
            document.querySelector(".modal-backdrop").style.display = "block";
            updateEditClusterSelect();
        }

        function updateEditClusterSelect() {
            const select = document.getElementById("editClusterSelect");
            select.innerHTML = '<option value="">Select Cluster</option>';
            data.nodes
                .filter(node => node.type === "cluster")
                .forEach(cluster => {
                    const option = document.createElement("option");
                    option.value = cluster.id;
                    option.textContent = cluster.name;
                    select.appendChild(option);
                });
        }

        function updateEditNodeList(clusterId) {
            const nodeList = document.getElementById("editNodeList");
            nodeList.innerHTML = '';

            const nodes = data.nodes.filter(node => {
                if (node.id === clusterId) return true;
                return data.links.some(link =>
                    link.target.id === clusterId && link.source.id === node.id);
            });

            nodes.forEach(node => {
                const div = document.createElement("div");
                div.className = "node-list-item";
                div.textContent = `${node.name} (${node.type})`;
                div.onclick = () => selectNodeForEdit(node, div);
                nodeList.appendChild(div);
            });
        }

        function selectNodeForEdit(node, element) {
            selectedNodeForEdit = node;
            document.querySelectorAll(".node-list-item").forEach(item =>
                item.classList.remove("selected"));
            element.classList.add("selected");
            document.getElementById("editNameInput").value = node.name;
        }

        function confirmEdit() {
            if (!selectedNodeForEdit) return;
            const newName = document.getElementById("editNameInput").value;
            if (newName.trim() === "") return;

            const node = data.nodes.find(n => n.id === selectedNodeForEdit.id);
            if (node) {
                node.name = newName;
            }

            selectedNodeForEdit = null;
            hideModals();
            updateGraph();
        }

        // Connection functionality
        function showConnectionModal() {
            document.getElementById("connectionModal").style.display = "block";
            document.querySelector(".modal-backdrop").style.display = "block";
            updateConnectionSelects();
        }

        function updateConnectionSelects() {
            const sourceSelect = document.getElementById("sourceClusterSelect");
            const targetSelect = document.getElementById("targetClusterSelect");

            sourceSelect.innerHTML = '<option value="">Select Source Cluster</option>';
            targetSelect.innerHTML = '<option value="">Select Target Cluster</option>';

            data.nodes
                .filter(node => node.type === "cluster")
                .forEach(cluster => {
                    const sourceOption = document.createElement("option");
                    sourceOption.value = cluster.id;
                    sourceOption.textContent = cluster.name;
                    sourceSelect.appendChild(sourceOption.cloneNode(true));

                    const targetOption = document.createElement("option");
                    targetOption.value = cluster.id;
                    targetOption.textContent = cluster.name;
                    targetSelect.appendChild(targetOption);
                });
        }

        function updateConnectionNodeList(clusterId, type) {
            const nodeList = document.getElementById(`${type}NodeList`);
            nodeList.innerHTML = '';

            const nodes = data.nodes.filter(node => {
                if (node.id === clusterId) return true;
                return data.links.some(link =>
                    link.target.id === clusterId && link.source.id === node.id);
            });

            nodes.forEach(node => {
                const div = document.createElement("div");
                div.className = "node-list-item";
                div.textContent = `${node.name} (${node.type})`;
                div.onclick = () => selectNodeForConnection(node, div, type);
                nodeList.appendChild(div);
            });
        }

        function selectNodeForConnection(node, element, type) {
            if (type === "source") {
                selectedSourceNode = node;
            } else {
                selectedTargetNode = node;
            }

            const nodeList = document.getElementById(`${type}NodeList`);
            nodeList.querySelectorAll(".node-list-item").forEach(item =>
                item.classList.remove("selected"));
            element.classList.add("selected");
        }

        function createConnection() {
            if (!selectedSourceNode || !selectedTargetNode) return;

            const userName = document.getElementById("userNameInput").value;
            const businessFunction = document.getElementById("businessFunctionInput").value;

            if (userName.trim() === "" || businessFunction.trim() === "") {
                alert("Please fill in all fields");
                return;
            }

            const connectionExists = data.links.some(link =>
                (link.source.id === selectedSourceNode.id && link.target.id === selectedTargetNode.id) ||
                (link.source.id === selectedTargetNode.id && link.target.id === selectedSourceNode.id)
            );

            if (!connectionExists) {
                data.links.push({
                    source: selectedSourceNode.id,
                    target: selectedTargetNode.id,
                    type: 'connection'
                });

                addActivityLog(
                    `Created connection between "${selectedSourceNode.name}" and "${selectedTargetNode.name}"`,
                    userName,
                    businessFunction
                );
            }

            selectedSourceNode = null;
            selectedTargetNode = null;
            hideModals();
            updateGraph();
            updateStats();
        }

        // Update event listeners
        document.getElementById("deleteClusterSelect").addEventListener("change", (e) => {
            updateDeleteNodeList(e.target.value);
        });

        document.getElementById("editClusterSelect").addEventListener("change", (e) => {
            updateEditNodeList(e.target.value);
        });

        document.getElementById("sourceClusterSelect").addEventListener("change", (e) => {
            updateConnectionNodeList(e.target.value, "source");
        });

        document.getElementById("targetClusterSelect").addEventListener("change", (e) => {
            updateConnectionNodeList(e.target.value, "target");
        });

        // Initialize graph
        // updateGraph();

        function showAddClusterModal() {
            document.getElementById("clusterModal").style.display = "block";
            document.querySelector(".modal-backdrop").style.display = "block";
        }

        function showAddTaskModal() {
            document.getElementById("taskModal").style.display = "block";
            document.querySelector(".modal-backdrop").style.display = "block";
        }

        function hideModals() {
            document.getElementById("rootModal").style.display = "none";
            document.getElementById("rootConnectionModal").style.display = "none";
            document.getElementById("clusterModal").style.display = "none";
            document.getElementById("taskModal").style.display = "none";
            document.getElementById("deleteModal").style.display = "none";
            document.getElementById("editModal").style.display = "none";
            document.getElementById("connectionModal").style.display = "none";  // Add this line
            document.querySelector(".modal-backdrop").style.display = "none";
            // Clear any input fields
            document.getElementById("rootInput").value = "";
            document.getElementById("rootUserNameInput").value = "";
            document.getElementById("rootBusinessFunctionInput").value = "";

            document.getElementById("clusterInput").value = "";
            document.getElementById("clusterUserNameInput").value = "";
            document.getElementById("clusterBusinessFunctionInput").value = "";

            document.getElementById("taskInput").value = "";
            document.getElementById("taskUserNameInput").value = "";
            document.getElementById("taskBusinessFunctionInput").value = "";
            document.getElementById("rootConnectionUserNameInput").value = "";
            document.getElementById("rootConnectionBusinessFunctionInput").value = "";
            document.getElementById("deleteUserNameInput").value = "";
            document.getElementById("deleteBusinessFunctionInput").value = "";

            // Hide all modals
            document.querySelectorAll(".modal").forEach(modal => modal.style.display = "none");
            document.querySelector(".modal-backdrop").style.display = "none";
            document.getElementById("editNameInput").value = "";
        }

        function addCluster() {
            const clusterName = document.getElementById("clusterInput").value;
            const userName = document.getElementById("clusterUserNameInput").value;
            const businessFunction = document.getElementById("clusterBusinessFunctionInput").value;

            if (clusterName.trim() === "" || userName.trim() === "" || businessFunction.trim() === "") {
                alert("Please fill in all fields");
                return;
            }

            const clusterId = `cluster-${Date.now()}`;
            const clusterColor = clusterColors[nextColorIndex % clusterColors.length];
            nextColorIndex++;

            data.nodes.push({
                id: clusterId,
                name: clusterName,
                type: "cluster",
                color: clusterColor
            });

            addActivityLog(`Added cluster "${clusterName}"`, userName, businessFunction);
            hideModals();
            updateGraph();
            updateStats();
        }

        function addTask() {
            const clusterId = document.getElementById("clusterSelect").value;
            const taskName = document.getElementById("taskInput").value;
            const userName = document.getElementById("taskUserNameInput").value;
            const businessFunction = document.getElementById("taskBusinessFunctionInput").value;

            if (taskName.trim() === "" || !clusterId || userName.trim() === "" || businessFunction.trim() === "") {
                alert("Please fill in all fields");
                return;
            }

            const cluster = data.nodes.find(n => n.id === clusterId);
            const taskId = `task-${Date.now()}`;

            data.nodes.push({
                id: taskId,
                name: taskName,
                type: "task",
                color: cluster.color
            });

            data.links.push({
                source: taskId,
                target: clusterId
            });

            addActivityLog(`Added task "${taskName}" to cluster "${cluster.name}"`, userName, businessFunction);
            hideModals();
            updateGraph();
            updateStats();

        }

        function handleNodeClick(event, d) {
            event.preventDefault();
            highlightNode(d);
        }

        function highlightNode(selectedNode) {
            node.classed("dimmed", false).classed("highlighted", false);
            link.classed("dimmed", false);

            if (selectedNode) {
                node.classed("dimmed", true);
                link.classed("dimmed", true);

                const connectedNodes = new Set();
                data.links.forEach(l => {
                    if (l.source.id === selectedNode.id || l.target.id === selectedNode.id) {
                        connectedNodes.add(l.source.id);
                        connectedNodes.add(l.target.id);
                    }
                });

                node.filter(d => connectedNodes.has(d.id))
                    .classed("dimmed", false);
                node.filter(d => d.id === selectedNode.id)
                    .classed("highlighted", true);

                link.filter(l =>
                    connectedNodes.has(l.source.id) && connectedNodes.has(l.target.id)
                ).classed("dimmed", false);
            }
        }

        function updateSelects() {
            const clusterSelect = document.getElementById("clusterSelect");
            clusterSelect.innerHTML = '<option value="">Select Cluster</option>';

            data.nodes
                .filter(node => node.type === "cluster")
                .forEach(cluster => {
                    const option = document.createElement("option");
                    option.value = cluster.id;
                    option.textContent = cluster.name;
                    clusterSelect.appendChild(option);
                });
        }

        function ticked() {
            circularLayoutForce(simulation.alpha());

            // Update positions
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        }

        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight - 64;

            svg.attr("width", width)
                .attr("height", height);

            simulation.force("center", d3.forceCenter(width / 2, height / 2));
            simulation.alpha(0.3).restart();
        });

        updateStats();
        updateActivityLogs();

        // Initialize graph
        updateGraph();
    </script>
</body>

</html>
